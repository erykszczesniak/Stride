spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
  # Mail defaults mirror the monolith: bean always present, sends silently
  # skipped while MAIL_USERNAME is blank. Overridden per env by config-server.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  name: Stride
  cors:
    # First entry doubles as the frontend base URL for email action links
    # (same derivation as the monolith's app.cors.allowed-origins).
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  weekly-summary:
    page-size: 200

management:
  health:
    mail:
      enabled: false  # blank creds must not fail the health probe (parity with main)

# Client side of the cluster-internal gRPC surfaces (UserInternalService,
# ActivityInternalService). Resolved through Eureka instance metadata
# (gRPC.port); plaintext inside the cluster. Applies in every profile: in
# standalone the resolver simply finds no instances and calls fail into the
# Resilience4j fallbacks (null -> skip email / skip user).
grpc:
  client:
    user-service:
      address: discovery:///user-service
      negotiationType: plaintext
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

# Resilience4j tuning for the internal user-service / activity-service calls.
# Generous in dev so fallbacks kick in quickly when peers aren't running;
# prod overlays live in config-server's notification-service.yml.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          # gRPC failures (UNAVAILABLE, DEADLINE_EXCEEDED, ...) all surface as
          # StatusRuntimeException — the transport-swap twin of RestClientException.
          - io.grpc.StatusRuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      activity-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - io.grpc.StatusRuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      user-service:
        maxAttempts: 2
        waitDuration: 200ms
      activity-service:
        maxAttempts: 2
        waitDuration: 200ms

# Local fallback — H2 + no Eureka + no Kafka consumers required for boot.
---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_notification;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.strava.shared.events,*
server:
  port: 8083
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
