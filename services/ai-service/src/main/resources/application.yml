spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

# Groq (goal / training-plan generation) — key names mirror the monolith's
# application.yml (groq.api-key / groq.model). Defaults apply in every profile.
groq:
  api:
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

app:
  # Anthropic Claude — powers the conversational AI activity-analysis chat.
  # Same env vars as the monolith; the model default is the current Anthropic
  # default (claude-opus-5). Unset key => chat POST returns 503, GET/DELETE work.
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

  # Guardrails for every provider-billed endpoint (see docs/ai-guardrails.md):
  # per-user rate limits (in-memory, per replica), prompt guard, PII masking,
  # and the price table AiCallRecorder uses for the ai_request_cost_usd metric.
  ai:
    rate-limit:
      chat-per-minute: ${AI_CHAT_PER_MINUTE:10}
      generation-per-minute: ${AI_GENERATION_PER_MINUTE:5}
    guard:
      enabled: ${AI_GUARD_ENABLED:true}
      max-repeated-chars: 40
    pii:
      enabled: ${AI_PII_MASKING_ENABLED:true}
    # Chat failover: Anthropic first, Groq (multi-turn) when Anthropic answers
    # 502/503, its breaker is open, or no key is configured. Degraded answers
    # beat no answers during a provider incident; every switch is counted.
    failover:
      enabled: ${AI_CHAT_FAILOVER_ENABLED:true}
    # USD per million tokens. Placeholders taken from the public price lists at
    # the time of writing — verify against the current lists before trusting
    # the cost panel; an unlisted model is recorded with priced=false.
    pricing:
      "[claude-opus-5]":
        input-per-mtok: 15.0
        output-per-mtok: 75.0
      "[claude-sonnet-5]":
        input-per-mtok: 3.0
        output-per-mtok: 15.0
      "[openai/gpt-oss-120b]":
        input-per-mtok: 0.15
        output-per-mtok: 0.60

# Cluster-internal gRPC client: the chat's activity context comes from
# activity-service's ActivityInternalService (grpc.server.port 9082). The
# channel resolves through Eureka via the discovery:/// scheme (the server
# publishes its port as `gRPC.port` instance metadata); plaintext inside the
# cluster. Inert in standalone: MockActivityClient replaces ActivityClient
# there, so no @GrpcClient injection point exists and the lazy channel is
# never created.
grpc:
  client:
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

# Resilience4j tuning. groq records every failure (GroqClient maps them all to
# ApiRequestException before they leave the method); activity-service records
# transport/RPC-level errors only. Prod overlays live in config-server's ai-service.yml.
resilience4j:
  circuitbreaker:
    instances:
      groq:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
      # Anthropic chat: every ApiRequestException from the client counts as a
      # failure (502 provider error, 503 unconfigured); an open breaker sends
      # chat to Groq through FailoverChatClient instead of waiting on timeouts.
      anthropic:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
      activity-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          # gRPC call failures (UNAVAILABLE, DEADLINE_EXCEEDED, INTERNAL, ...)
          # surface as StatusRuntimeException — must be recorded or the breaker
          # would never open on a dead activity-service. RestClientException
          # left with the retired lb:// RestTemplate (Phase 23c).
          - io.grpc.StatusRuntimeException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      groq:
        maxAttempts: 2
        waitDuration: 300ms
      activity-service:
        maxAttempts: 2
        waitDuration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true

# Local fallback — H2 + no Eureka + mock AI / activity clients (see @Profile("standalone")).
---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
server:
  port: 8087
eureka:
  client:
    enabled: false
