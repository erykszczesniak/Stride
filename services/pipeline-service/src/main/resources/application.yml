spring:
  application:
    name: pipeline-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

server:
  port: 8089

# /pipeline/v1/** also accepts a Stride JWT — must be validated with the same
# secret the gateway/user-service sign with. Overridden by config-server in
# composed environments.
jwt:
  secret: ${JWT_SECRET}

# Resilience4j tuning for the REST composition (applies in every profile;
# config-server overlays tighten it for prod). Downstream failures either
# degrade (goals/events/power enrichment) or surface as the pipeline
# contract's server_error (activities/records/profile identity).
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        ignoreExceptions:
          - com.strava.pipeline.exception.ApiRequestException
    instances:
      activity-service:
        baseConfig: default
      user-service:
        baseConfig: default
      challenge-goal-service:
        baseConfig: default
      club-event-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - com.strava.pipeline.exception.ApiRequestException
    instances:
      activity-service:
        baseConfig: default
      user-service:
        baseConfig: default
      challenge-goal-service:
        baseConfig: default
      club-event-service:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true

# Cluster-internal gRPC client (Phase 23c): ActivityInternalService.GetActivities
# replaces the REST /internal/activities?ids= power enrichment. The discovery://
# scheme resolves activity-service through Eureka (net.devh publishes the gRPC
# port as `gRPC.port` instance metadata); plaintext because the port is
# cluster-internal and never routed by the gateway — same trust model as the
# lb:// REST calls. In the standalone profile Eureka is off, so the resolver
# simply finds no instances: boot is unaffected (channels connect lazily) and
# calls degrade through the Resilience4j fallback (power enrichment → empty).
grpc:
  client:
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_pipeline;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common

eureka:
  client:
    enabled: false
jwt:
  # Explicit dev value for the no-config-server profile only; every other
  # profile requires JWT_SECRET (see .env.example).
  secret: dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod
