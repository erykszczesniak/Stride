# Test-classpath shadow of the main application.yml: no config-server import,
# no Eureka, H2 with the real Flyway chain (V1) validated by Hibernate.
spring:
  application:
    name: pipeline-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:test_pipeline;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
eureka:
  client:
    enabled: false
jwt:
  secret: test-secret-min-32-chars-used-only-inside-unit-tests
