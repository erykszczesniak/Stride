spring:
  application:
    name: activity-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000
  # Multipart ceiling: activity-file imports accept up to 10MB (service-side
  # MAX_IMPORT_FILE_SIZE); photos stay capped at 5MB by the service-side
  # MAX_PHOTO_SIZE check. 25MB per request (5 photos x 5MB).
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/photos}
  # Strava OAuth2 integration (import flow only — the "Continue with Strava"
  # LOGIN variant is owned by user-service). Empty defaults on purpose: the
  # service boots without credentials, but /api/v1/integrations/strava
  # endpoints answer 503 until STRAVA_* env vars are set.
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/v1/integrations/strava/callback}
    state-secret: ${STRAVA_STATE_SECRET:}
    frontend-redirect: ${STRAVA_FRONTEND_REDIRECT:http://localhost:3000/settings?section=account}
    # Pull the per-activity streams endpoint to populate GPS polyline, per-point
    # timestamps, and elevation on imported activities. Set
    # STRAVA_IMPORT_STREAMS=false when bulk-importing 1000+ activities to
    # conserve the 100 req / 15 min rate-limit budget.
    import-streams: ${STRAVA_IMPORT_STREAMS:true}

# Resilience4j tuning (applies in every profile). Generous in dev so that the
# smoke test sees the fallback path quickly when user-service/social-service
# aren't running; prod overlays live in the config server.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
    instances:
      user-service:
        baseConfig: default
      social-service:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2
    instances:
      user-service:
        baseConfig: default
      social-service:
        baseConfig: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true

# Local fallback — H2 + no Eureka/Kafka listeners, used for fast smoke tests.
---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_activity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    # db/migration/h2 carries the H2 flavor of vendor-specific statements
    # (identity restart after the fixed-id sample inserts).
    locations: classpath:db/migration/common,classpath:db/migration/h2
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 2000
        request.timeout.ms: 1500
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.strava.shared.events,*
server:
  port: 8082
eureka:
  client:
    enabled: false
