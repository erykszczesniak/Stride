spring:
  application:
    name: club-event-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_club_event;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
server:
  port: 8085
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
