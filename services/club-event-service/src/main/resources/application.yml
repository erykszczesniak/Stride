spring:
  application:
    name: club-event-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

# Resilience4j tuning for the user-service batch lookup (applies in every
# profile). Generous in dev so the fallback path shows up quickly when
# user-service isn't running; tightened for prod in the config server.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 3
        permittedNumberOfCallsInHalfOpenState: 2
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2

---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_club_event;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
server:
  port: 8085
eureka:
  client:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries
