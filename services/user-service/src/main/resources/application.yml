spring:
  application:
    name: user-service
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

# Local fallback profile — run user-service without the rest of the stack.
# Activate with -Dspring.profiles.active=standalone.
---
spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:h2:mem:stride_user;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 1000
        delivery.timeout.ms: 2000
        request.timeout.ms: 1500
  data:
    redis:
      host: localhost
server:
  port: 8081
eureka:
  client:
    enabled: false
jwt:
  secret: dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod
  access-token-ttl-seconds: 3600
  refresh-token-ttl-seconds: 604800
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
