global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: stride-microservices

scrape_configs:

  - job_name: 'config-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['config-server:8888']

  - job_name: 'discovery-server'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['discovery-server:8761']

  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']

  # Domain services — added per phase as services come online.
  # Spring Cloud Gateway discovers services via Eureka; Prometheus can either
  # use eureka_sd_configs or be updated statically as we extract each service.
  # For now: static targets, will switch to eureka_sd_configs in Phase 9.
  - job_name: 'user-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8081']

  - job_name: 'activity-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['activity-service:8082']
