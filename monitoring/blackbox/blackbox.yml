# Blackbox exporter modules (monitoring/prometheus/targets/blackbox.json picks
# one per target). Each probe answers the question "does this look up from
# outside the process?" — it does not read application metrics, it opens a
# socket and speaks the protocol like a user or a load balancer would.
#
# Check locally:
#   docker run --rm -v "$PWD/monitoring/blackbox:/config:ro" \
#     prom/blackbox-exporter:v0.27.0 --config.check --config.file=/config/blackbox.yml
modules:

  # Plain HTTP GET; follows redirects, IPv4 only (compose networks have no
  # AAAA records and a v6 attempt would add a failed connection to every probe).
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []        # defaults to 2xx

  # Health endpoint of the API: must answer 200 *and* say UP in the JSON body.
  # A 200 with {"status":"DOWN"} is what Spring Boot returns when a dependency
  # (database, Elasticsearch) is unhealthy, so the status code alone is not enough.
  http_2xx_json:
    prober: http
    timeout: 5s
    http:
      method: GET
      follow_redirects: false
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_status_codes: [200]
      headers:
        Accept: application/json
      fail_if_body_not_matches_regexp:
        - '"status"\s*:\s*"UP"'

  # TCP handshake only — for Postgres, where an HTTP probe makes no sense and
  # a protocol-level login would need credentials in the exporter.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
