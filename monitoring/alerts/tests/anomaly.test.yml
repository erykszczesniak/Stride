rule_files:
  - ../slo.rules.yml
  - ../anomaly.rules.yml

evaluation_interval: 1m

tests:

  # ------------------------------------------------- JvmHeapExhaustionPredicted
  # Heap climbs 0.2 % of max per minute (12 %/h) from 60 %: the 4 h projection
  # is above 100 % from the first minute, usage is above the 60 % guard, so the
  # alert is pending from t≈1m and fires after 30 minutes. At 45m the heap is
  # at 69 % and the projection about 117 % (116.8 % from the recorded series,
  # which lags one evaluation). JvmHeapHigh (static 90 %) has not fired yet.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '600+2x120'
      - series: 'jvm_memory_max_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '1000+0x120'
    alert_rule_test:
      - eval_time: 20m
        alertname: JvmHeapExhaustionPredicted
        exp_alerts: []
      - eval_time: 45m
        alertname: JvmHeapExhaustionPredicted
        exp_alerts:
          - exp_labels:
              app: strava-backend
              instance: backend:8080
              severity: warning
              team: domain
              tier: "1"
              service: strava-backend
            exp_annotations:
              summary: "strava-backend heap on course for 116.8% of max within 4 h"
              description: "A linear fit over the last hour of heap usage on backend:8080 crosses 100% of max heap within four hours, and usage is already above 60%. A steady climb like this is a leak or a batch job (import, export, weekly summary) that outgrew the limit; a stable high heap does not fire this alert."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/main/docs/runbooks/anomaly-detected.md
              dashboard_url: http://localhost:3003/d/stride-jvm
    promql_expr_test:
      - expr: anomaly:jvm_heap_used:ratio{app="strava-backend"}
        eval_time: 45m
        exp_samples:
          - labels: 'anomaly:jvm_heap_used:ratio{app="strava-backend",instance="backend:8080"}'
            value: 0.69

  # Quiet: 85 % heap, flat. High, but not going anywhere — the static
  # JvmHeapHigh rule owns the "too high" case, this one must stay silent.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '850+0x120'
      - series: 'jvm_memory_max_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '1000+0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: JvmHeapExhaustionPredicted
        exp_alerts: []

  # Quiet: a cold start climbing fast but from a low level (10 % → 34 % in
  # two hours). The slope would cross max in 4 h, but the 60 % guard holds.
  - interval: 1m
    input_series:
      - series: 'jvm_memory_used_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '100+2x120'
      - series: 'jvm_memory_max_bytes{app="strava-backend",instance="backend:8080",area="heap",id="G1 Old Gen"}'
        values: '1000+0x120'
    alert_rule_test:
      - eval_time: 100m
        alertname: JvmHeapExhaustionPredicted
        exp_alerts: []

  # -------------------------------------------------- DbPoolExhaustionPredicted
  # 10 of 20 connections busy, then one more every five minutes (0.6 of the
  # pool per hour): the 1 h projection is above the maximum while the pool is
  # already more than half used. Fires after 15 minutes; at 20m the pool is
  # 70 % busy and projected to 130 %.
  - interval: 1m
    input_series:
      - series: 'hikaricp_connections_active{app="strava-backend",instance="backend:8080",pool="HikariPool-1"}'
        values: '10+0.2x60'
      - series: 'hikaricp_connections_max{app="strava-backend",instance="backend:8080",pool="HikariPool-1"}'
        values: '20+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: DbPoolExhaustionPredicted
        exp_alerts: []
      - eval_time: 20m
        alertname: DbPoolExhaustionPredicted
        exp_alerts:
          - exp_labels:
              app: strava-backend
              instance: backend:8080
              severity: warning
              team: domain
              tier: "1"
              service: strava-backend
            exp_annotations:
              summary: "strava-backend DB pool on course for 130% in use within 1 h"
              description: "Active HikariCP connections on backend:8080 have been climbing for 30 minutes and the trend reaches the pool maximum within an hour; more than half the pool is already busy. Connections that are checked out and not returned (a long transaction, a leaked EntityManager) look exactly like this before DbPoolExhausted fires."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/main/docs/runbooks/anomaly-detected.md
              dashboard_url: http://localhost:3003/d/stride-jvm

  # Quiet: a busy but steady pool (16 of 20 = 80 %). DbPoolSaturated is the
  # rule for "too full"; a flat line is not a trend.
  - interval: 1m
    input_series:
      - series: 'hikaricp_connections_active{app="strava-backend",instance="backend:8080",pool="HikariPool-1"}'
        values: '16+0x60'
      - series: 'hikaricp_connections_max{app="strava-backend",instance="backend:8080",pool="HikariPool-1"}'
        values: '20+0x60'
    alert_rule_test:
      - eval_time: 50m
        alertname: DbPoolExhaustionPredicted
        exp_alerts: []

  # --------------------------------------- TrafficDeviatesFromWeeklyBaseline
  # 5-minute samples so that a week fits in ~2000 points. 2 req/s for a whole
  # week (600 requests per 5 minutes), then the rate drops to 0.5 req/s at
  # exactly one week: ratio 0.25 against a 2 req/s baseline. The 1 h window is
  # fully in the new regime from 1w+60m, the alert is pending from then and
  # fires 30 minutes later.
  - interval: 5m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+600x2015 1209600+150x40'
    alert_rule_test:
      - eval_time: 10090m
        alertname: TrafficDeviatesFromWeeklyBaseline
        exp_alerts: []
      - eval_time: 10180m
        alertname: TrafficDeviatesFromWeeklyBaseline
        exp_alerts:
          - exp_labels:
              app: strava-backend
              severity: warning
              team: platform
              tier: "2"
              service: strava-backend
            exp_annotations:
              summary: "strava-backend traffic is 0.25x the same hour last week"
              description: "The request rate over the last hour is below half or above three times what it was at the same hour seven days ago (baseline floored at 0.1 req/s; the low branch needs a baseline above 0.5 req/s, the high branch needs current traffic above 1 req/s). Below: a client, a login flow or a route may be broken while the backend reports healthy. Above: capacity and the DB pool are the next things to watch."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/main/docs/runbooks/anomaly-detected.md
              dashboard_url: http://localhost:3003/d/stride-slo
    promql_expr_test:
      - expr: anomaly:http_requests:weekly_ratio{app="strava-backend"}
        eval_time: 10180m
        exp_samples:
          - labels: 'anomaly:http_requests:weekly_ratio{app="strava-backend"}'
            value: 0.25

  # Surge: 2 req/s for a week, then 8 req/s (2400 per 5 minutes) — 4x the
  # baseline with current traffic well above the 1 req/s floor.
  - interval: 5m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+600x2015 1209600+2400x40'
    alert_rule_test:
      - eval_time: 10180m
        alertname: TrafficDeviatesFromWeeklyBaseline
        exp_alerts:
          - exp_labels:
              app: strava-backend
              severity: warning
              team: platform
              tier: "2"
              service: strava-backend
            exp_annotations:
              summary: "strava-backend traffic is 4.00x the same hour last week"
              description: "The request rate over the last hour is below half or above three times what it was at the same hour seven days ago (baseline floored at 0.1 req/s; the low branch needs a baseline above 0.5 req/s, the high branch needs current traffic above 1 req/s). Below: a client, a login flow or a route may be broken while the backend reports healthy. Above: capacity and the DB pool are the next things to watch."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/main/docs/runbooks/anomaly-detected.md
              dashboard_url: http://localhost:3003/d/stride-slo

  # Quiet: a dev stack with 0.2 req/s last week and nothing now. The ratio is
  # 0, but the baseline is under the 0.5 req/s floor — too little traffic to
  # call a 100 % drop an anomaly (EdgeTrafficCollapse has its own floor).
  - interval: 5m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+60x2015 120960+0x40'
    alert_rule_test:
      - eval_time: 10180m
        alertname: TrafficDeviatesFromWeeklyBaseline
        exp_alerts: []

  # Quiet: 1.5x last week — Monday after a quiet Sunday is not an anomaly.
  - interval: 5m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+600x2015 1209600+900x40'
    alert_rule_test:
      - eval_time: 10180m
        alertname: TrafficDeviatesFromWeeklyBaseline
        exp_alerts: []

  # --------------------------------------------------------- ErrorRatioDeviation
  # A day at 1 req/s with no 5xx at all, then 5 % errors. The 24 h mean is
  # ~0 and the standard deviation is floored at 0.005, so the score is around
  # 10 — well above 3 — and the ratio is above the 1 % floor. Fires after
  # 10 minutes; the burn-rate alerts are still quiet at 5 % over 5 minutes
  # (they need the 1 h window above 7.2 % as well).
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+57x1480'
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="500",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+0x1440 0+3x40'
    alert_rule_test:
      - eval_time: 1440m
        alertname: ErrorRatioDeviation
        exp_alerts: []
      - eval_time: 1460m
        alertname: ErrorRatioDeviation
        exp_alerts:
          - exp_labels:
              app: strava-backend
              severity: warning
              team: domain
              tier: "1"
              service: strava-backend
            exp_annotations:
              summary: "strava-backend 5xx ratio is 9.4 standard deviations above its 24 h mean"
              description: "The 5-minute 5xx ratio is more than 3 standard deviations above its own average of the last 24 hours and above 1% in absolute terms. This is a change, not necessarily an SLO breach yet: the burn-rate alerts fire at 3% and 7.2%. Correlate with the last deploy and the per-endpoint error alert first."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/main/docs/runbooks/anomaly-detected.md
              dashboard_url: http://localhost:3003/d/stride-slo
      - eval_time: 1460m
        alertname: SLOBurnRateFast
        exp_alerts: []

  # Quiet: a service that has run at a steady 3 % error ratio all day. That
  # is an SLO problem (SLOBurnRateSlow owns it), not an anomaly: the z-score
  # is 0 because nothing changed.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+97x1480'
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="500",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+3x1480'
    alert_rule_test:
      - eval_time: 1460m
        alertname: ErrorRatioDeviation
        exp_alerts: []

  # Quiet: a single failed request on a quiet service. The ratio jumps from
  # 0 to 0.33 % — a huge z-score, but under the 1 % absolute floor.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="200",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+60x1480'
      - series: 'http_server_requests_seconds_count{job="strava-backend",app="strava-backend",status="500",uri="/api/v1/activities/feed",method="GET"}'
        values: '0+0x1440 0+0.2x40'
    alert_rule_test:
      - eval_time: 1460m
        alertname: ErrorRatioDeviation
        exp_alerts: []
