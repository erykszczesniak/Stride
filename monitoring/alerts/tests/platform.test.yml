# promtool unit tests for platform.rules.yml. Each alert has a firing case
# with the exact labels/annotations a responder will see, and a case that
# must stay quiet. Run: see .github/instructions/alert-rules.instructions.md
rule_files:
  - ../platform.rules.yml

evaluation_interval: 1m

tests:

  # ----------------------------------------------------------------- ServiceDown
  - interval: 1m
    input_series:
      - series: 'up{job="stride-services",app="activity-service",instance="activity-service:8082"}'
        values: '1 1 0 0 0 0 0 0'
      - series: 'up{job="stride-services",app="user-service",instance="user-service:8081"}'
        values: '1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 5m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              job: stride-services
              app: activity-service
              instance: activity-service:8082
              severity: critical
              team: platform
              tier: "2"
              service: activity-service
            exp_annotations:
              summary: "activity-service scrape failing (activity-service:8082)"
              description: "Prometheus cannot scrape activity-service at activity-service:8082 for 2 minutes. The instance is down or its /actuator/prometheus endpoint is unreachable."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/service-down.md
              dashboard_url: http://localhost:3001/d/stride-jvm

  # -------------------------------------------------------------- ServiceMissing
  # Nine of ten services registered; activity-service never showed up.
  - interval: 1m
    input_series:
      - series: 'up{job="stride-services",app="api-gateway",instance="g"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="user-service",instance="u"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="social-service",instance="s"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="notification-service",instance="n"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="club-event-service",instance="c"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="challenge-goal-service",instance="cg"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="ai-service",instance="ai"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="web-bff",instance="w"}'
        values: '1+0x10'
      - series: 'up{job="stride-services",app="pipeline-service",instance="p"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: ServiceMissing
        exp_alerts:
          - exp_labels:
              app: activity-service
              severity: critical
              team: platform
              tier: "2"
              service: activity-service
            exp_annotations:
              summary: "activity-service has no instances registered"
              description: "No activity-service instance is registered in Eureka, so Prometheus has no target for it. Either every replica is down or the service never registered after a deploy."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/service-down.md

  # -------------------------------------------------------- GatewayHighErrorRate
  # 10 req/min 5xx against 90 req/min 2xx = 10% error ratio.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="500",uri="/api/v1/activities",method="GET"}'
        values: '0+10x30'
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="200",uri="/api/v1/activities",method="GET"}'
        values: '0+90x30'
      # Actuator traffic must be ignored, so an all-5xx probe cannot trip it.
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="503",uri="/actuator/health",method="GET"}'
        values: '0+100x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              team: platform
              tier: "2"
              service: api-gateway
              app: api-gateway
            exp_annotations:
              summary: "Gateway 5xx ratio 10% over 5m"
              description: "More than 5% of requests through the API gateway end in 5xx. Users are seeing errors. Check which route (routeId) and which downstream service is failing before touching the gateway."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/gateway-high-error-rate.md
              dashboard_url: http://localhost:3001/d/stride-slo
      - eval_time: 12m
        alertname: GatewayElevatedErrorRate
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              tier: "1"
              service: api-gateway
              app: api-gateway
            exp_annotations:
              summary: "Gateway 5xx ratio 10% over 10m"
              description: "Between 1% and 5% of edge requests fail. Not paging yet, but the error budget is burning — see the SLO dashboard."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/gateway-high-error-rate.md
              dashboard_url: http://localhost:3001/d/stride-slo

  # 1% errors: below both thresholds, nothing fires.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="500",uri="/api/v1/activities",method="GET"}'
        values: '0+1x30'
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="200",uri="/api/v1/activities",method="GET"}'
        values: '0+99x30'
    alert_rule_test:
      - eval_time: 15m
        alertname: GatewayHighErrorRate
        exp_alerts: []
      - eval_time: 15m
        alertname: GatewayElevatedErrorRate
        exp_alerts: []

  # ------------------------------------------------------- GatewayTrafficCollapse
  # One request per second for an hour, then nothing for over an hour.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{app="api-gateway",job="stride-services",status="200",uri="/api/v1/activities",method="GET"}'
        values: '0+60x60 3600+0x70'
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayTrafficCollapse
        exp_alerts: []
      - eval_time: 130m
        alertname: GatewayTrafficCollapse
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              tier: "2"
              service: api-gateway
              app: api-gateway
            exp_annotations:
              summary: "Edge traffic collapsed to 0 req/s"
              description: "Requests through the gateway dropped below 0.05 req/s for 10 minutes although the previous hour averaged above 0.5 req/s. The gateway is reachable by Prometheus but users are not arriving."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/gateway-traffic-collapse.md

  # --------------------------------------------------------- GatewayHighLatencyP95
  # All requests land in the 2.5 s bucket: p95 interpolates well above 1 s.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{app="api-gateway",job="stride-services",uri="/api/v1/activities",le="0.5"}'
        values: '0+0x30'
      - series: 'http_server_requests_seconds_bucket{app="api-gateway",job="stride-services",uri="/api/v1/activities",le="1.0"}'
        values: '0+0x30'
      - series: 'http_server_requests_seconds_bucket{app="api-gateway",job="stride-services",uri="/api/v1/activities",le="2.5"}'
        values: '0+60x30'
      - series: 'http_server_requests_seconds_bucket{app="api-gateway",job="stride-services",uri="/api/v1/activities",le="+Inf"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayHighLatencyP95
        exp_alerts:
          - exp_labels:
              severity: warning
              team: platform
              tier: "1"
              service: api-gateway
              app: api-gateway
            exp_annotations:
              summary: "Gateway p95 latency 2.425s"
              description: "95th percentile of edge request latency is above 1 s for 10 minutes."
              runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/high-latency.md
              dashboard_url: http://localhost:3001/d/stride-slo
