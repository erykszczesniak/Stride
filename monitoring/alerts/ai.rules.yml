# ai-service: two external LLM providers (Anthropic for chat, Groq for
# goal/plan generation) behind Resilience4j. Provider trouble must show up as
# "the provider", not as a generic 5xx on a Kotlin service.
groups:
  - name: stride-ai
    rules:

      # The chat is being served by the secondary provider. Users get answers,
      # but degraded ones, and Groq spend appears on the chat endpoint — worth a
      # ticket even though nothing is "down".
      - alert: AiProviderFailoverActive
        expr: sum(rate(ai_failover_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
          team: ai
          tier: "2"
          service: ai-service
          app: ai-service
        annotations:
          summary: "Chat is failing over to the secondary provider"
          description: "FailoverChatClient has routed chat turns from Anthropic to Groq for 10 minutes. Check AiProviderCircuitOpen (breaker 'anthropic') and the Anthropic status page; answers are degraded until the primary recovers."
          runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/ai-provider-degraded.md
          dashboard_url: http://localhost:3001/d/stride-cost

      - alert: AiProviderCircuitOpen
        expr: resilience4j_circuitbreaker_state{app="ai-service",state="open"} == 1
        for: 2m
        labels:
          severity: warning
          team: ai
          tier: "2"
          service: ai-service
        annotations:
          summary: "ai-service breaker '{{ $labels.name }}' open — provider is being skipped"
          description: "Calls to '{{ $labels.name }}' are short-circuited. Chat/goal requests fail fast (502/503) until the provider recovers or the failover path takes over."
          runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/ai-provider-degraded.md

      - alert: AiChatErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{app="ai-service",uri=~"/api/v1/ai.*",status=~"5.."}[10m]))
            /
          sum(rate(http_server_requests_seconds_count{app="ai-service",uri=~"/api/v1/ai.*"}[10m]))
            > 0.10
        for: 5m
        labels:
          severity: warning
          team: ai
          tier: "2"
          service: ai-service
          app: ai-service
        annotations:
          summary: "AI endpoints failing: {{ $value | humanizePercentage }} 5xx"
          description: "More than 10% of /api/v1/ai requests fail. 502 = provider error, 503 = not configured or breaker open; the runbook maps each to an action."
          runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/ai-provider-degraded.md

      - alert: AiChatLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{app="ai-service",uri=~"/api/v1/ai.*"}[10m]))
          ) > 15
        for: 10m
        labels:
          severity: warning
          team: ai
          tier: "1"
          service: ai-service
          app: ai-service
        annotations:
          summary: "AI p95 latency {{ $value | humanizeDuration }}"
          description: "95th percentile of AI request latency is above 15 s. The provider is slow or the prompt (recent-history block) has grown; users hit the frontend timeout."
          runbook_url: https://github.com/erykszczesniak/Stride/blob/microservices/docs/runbooks/ai-provider-degraded.md
