version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: strava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strava}
      POSTGRES_USER: ${POSTGRES_USER:-strava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strava} -d ${POSTGRES_DB:-strava}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strava-network

  # ============================================
  # Elasticsearch (full-text user search)
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.4
    container_name: strava-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - strava-network

  # ============================================
  # Backend (Spring Boot)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strava-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-strava}
      DATABASE_USERNAME: ${POSTGRES_USER:-strava}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DATABASE_DRIVER: org.postgresql.Driver
      HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HIBERNATE_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:80,http://localhost
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # AI guardrails (docs/ai-guardrails.md); defaults are the production values
      AI_CHAT_PER_MINUTE: ${AI_CHAT_PER_MINUTE:-10}
      AI_GENERATION_PER_MINUTE: ${AI_GENERATION_PER_MINUTE:-5}
      AI_GUARD_ENABLED: ${AI_GUARD_ENABLED:-true}
      AI_PII_MASKING_ENABLED: ${AI_PII_MASKING_ENABLED:-true}
      AI_CHAT_FAILOVER_ENABLED: ${AI_CHAT_FAILOVER_ENABLED:-true}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - strava-network

  # ============================================
  # Jaeger (Distributed Tracing — OTLP receiver + UI)
  # ============================================
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: strava-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - strava-network

  # ============================================
  # Prometheus (Metrics)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: strava-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle          # `curl -X POST :9091/-/reload` after editing rules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strava-network

  # ============================================
  # Alertmanager (routing) + alert-sink (local receiver)
  # ============================================
  # Rules come from Prometheus; Alertmanager groups, inhibits and delivers.
  # Locally every notification lands in `alert-sink`, an HTTP echo container,
  # so `docker compose logs -f alert-sink` shows exactly what a pager or Teams
  # channel would receive. Point receivers at real webhooks via
  # monitoring/alertmanager/alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: strava-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - strava-network

  alert-sink:
    image: mendhak/http-https-echo:35
    container_name: strava-alert-sink
    restart: unless-stopped
    environment:
      HTTP_PORT: "8000"
      ECHO_BACK_TO_CLIENT: "false"
    networks:
      - strava-network

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: strava-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - strava-network

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: /api/v1
    container_name: strava-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - strava-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  strava-network:
    driver: bridge
