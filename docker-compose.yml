name: strava-microservices

# Full microservices stack for local development.
# Start: docker compose up -d
# Logs:  docker compose logs -f <service>
# Stop:  docker compose down (-v to wipe volumes)

services:

  # ============================================
  # Messaging — Kafka in KRaft mode (no Zookeeper)
  # ============================================
  kafka:
    # Official Apache image (Bitnami's Docker Hub tags were withdrawn upstream).
    image: apache/kafka:3.9.0
    container_name: stride-kafka
    restart: unless-stopped
    mem_limit: 768m
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [stride-net]

  kafka-ui:
    profiles: ["observability"]
    image: provectuslabs/kafka-ui:latest
    container_name: stride-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [stride-net]

  # ============================================
  # Cache + rate limit
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: stride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [stride-net]

  # ============================================
  # Search — Elasticsearch (user search index; SQL fallback when down)
  # ============================================
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: stride-elasticsearch
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [stride-net]

  # ============================================
  # Distributed tracing
  # ============================================
  jaeger:
    # 1.62 was withdrawn from Docker Hub; 1.71 is the current maintained v1 line.
    image: jaegertracing/all-in-one:1.71.0
    container_name: stride-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks: [stride-net]

  # ============================================
  # Metrics + dashboards
  # ============================================
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.0
    container_name: stride-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    networks: [stride-net]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    container_name: stride-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [stride-net]

  # ============================================
  # Postgres — one DB per service (database-per-service pattern)
  # ============================================
  postgres-user:
    image: postgres:16-alpine
    container_name: stride-postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_user
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-activity:
    image: postgres:16-alpine
    container_name: stride-postgres-activity
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_activity
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5434:5432"
    volumes:
      - postgres_activity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_activity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-social:
    image: postgres:16-alpine
    container_name: stride-postgres-social
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_social
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5435:5432"
    volumes:
      - postgres_social_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_social"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-notification:
    image: postgres:16-alpine
    container_name: stride-postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_notification
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5436:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_notification"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-club-event:
    image: postgres:16-alpine
    container_name: stride-postgres-club-event
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_club_event
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5437:5432"
    volumes:
      - postgres_club_event_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_club_event"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-challenge-goal:
    image: postgres:16-alpine
    container_name: stride-postgres-challenge-goal
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_challenge_goal
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5438:5432"
    volumes:
      - postgres_challenge_goal_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_challenge_goal"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  postgres-ai:
    image: postgres:16-alpine
    container_name: stride-postgres-ai
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_ai
      POSTGRES_USER: stride
