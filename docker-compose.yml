    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres-ai
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stride_ai
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8087/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [stride-net]

  web-bff:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 640m
    build:
      context: .
      dockerfile: services/web-bff/Dockerfile
    image: stride/web-bff:dev
    container_name: stride-web-bff
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [stride-net]

  pipeline-service:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 640m
    build:
      context: .
      dockerfile: services/pipeline-service/Dockerfile
    image: stride/pipeline-service:dev
    container_name: stride-pipeline-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres-pipeline
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stride_pipeline
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-pipeline:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [stride-net]

networks:
  stride-net:
    driver: bridge
    name: stride-net

volumes:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
  activity_uploads:
  postgres_user_data:
  postgres_activity_data:
  postgres_social_data:
  postgres_notification_data:
  postgres_club_event_data:
  postgres_challenge_goal_data:
  postgres_ai_data:
  postgres_pipeline_data:
