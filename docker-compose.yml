  postgres-pipeline:
    image: postgres:16-alpine
    container_name: stride-postgres-pipeline
    restart: unless-stopped
    environment:
      POSTGRES_DB: stride_pipeline
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
    ports:
      - "5440:5432"
    volumes:
      - postgres_pipeline_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [stride-net]

  # ============================================
  # Spring Cloud infrastructure
  # ============================================
  config-server:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 384m
    build:
      context: .
      dockerfile: infrastructure/config-server/Dockerfile
    image: stride/config-server:dev
    container_name: stride-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8888/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [stride-net]

  discovery-server:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 448m
    build:
      context: .
      dockerfile: infrastructure/discovery-server/Dockerfile
    image: stride/discovery-server:dev
    container_name: stride-discovery-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [stride-net]

  api-gateway:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 512m
    build:
      context: .
      dockerfile: infrastructure/api-gateway/Dockerfile
    image: stride/api-gateway:dev
    container_name: stride-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod}
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [stride-net]

  # ============================================
  # Domain services
  # ============================================
  user-service:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 640m
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: stride/user-service:dev
    container_name: stride-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres-user
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stride_user
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_LOGIN_REDIRECT_URI: ${STRAVA_LOGIN_REDIRECT_URI:-http://localhost:8080/api/v1/auth/strava/callback}
      STRAVA_LOGIN_FRONTEND_REDIRECT: ${STRAVA_LOGIN_FRONTEND_REDIRECT:-http://localhost:3000/oauth2/strava}
      STRAVA_LOGIN_FRONTEND_ERROR_REDIRECT: ${STRAVA_LOGIN_FRONTEND_ERROR_REDIRECT:-http://localhost:3000/login}
      STRAVA_STATE_SECRET: ${STRAVA_STATE_SECRET:-}
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-user:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [stride-net]

  activity-service:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 640m
    build:
      context: .
      dockerfile: services/activity-service/Dockerfile
    image: stride/activity-service:dev
    container_name: stride-activity-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres-activity
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stride_activity
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_DIR: /data/uploads/photos
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/strava/callback}
      STRAVA_FRONTEND_REDIRECT: ${STRAVA_FRONTEND_REDIRECT:-http://localhost:3000/settings}
      STRAVA_STATE_SECRET: ${STRAVA_STATE_SECRET:-}
      STRAVA_IMPORT_STREAMS: ${STRAVA_IMPORT_STREAMS:-true}
    volumes:
      - activity_uploads:/data/uploads
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-activity:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [stride-net]

  notification-service:
