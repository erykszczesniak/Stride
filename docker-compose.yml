    mem_limit: 640m
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    image: stride/social-service:dev
    container_name: stride-social-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      POSTGRES_HOST: postgres-social
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stride_social
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stride}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discovery-server:
        condition: service_healthy
      postgres-social:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [stride-net]

  club-event-service:
    # Heap sizes itself from this limit via -XX:MaxRAMPercentage=75.
    mem_limit: 640m
    build:
      context: .
      dockerfile: services/club-event-service/Dockerfile
    image: stride/club-event-service:dev
    container_name: stride-club-event-service
