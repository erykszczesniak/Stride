# Copy to 01-secrets.yaml and fill in real values BEFORE applying.
# Never commit the populated file — it's gitignored under k8s/01-secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: stride-secrets
  namespace: stride
type: Opaque
stringData:
  # Shared HS256 secret used by api-gateway (JWT validation) and user-service
  # (JWT issuing). Min 32 chars.
  JWT_SECRET: "REPLACE_ME_min_32_chars_for_HS256"

  # Postgres password used by every per-service database.
  POSTGRES_PASSWORD: "REPLACE_ME"

  # Groq Chat Completions API key (ai-service: goal/plan generation).
  GROQ_API_KEY: ""

  # Anthropic API key (ai-service: per-activity AI chat; 503 when empty).
  ANTHROPIC_API_KEY: ""

  # Strava OAuth app (user-service login + activity-service import).
  STRAVA_CLIENT_ID: ""
  STRAVA_CLIENT_SECRET: ""
  STRAVA_STATE_SECRET: ""

  # Google sign-in client id (user-service).
  GOOGLE_CLIENT_ID: ""

  # SMTP credentials (notification-service emails; skipped when empty).
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""
