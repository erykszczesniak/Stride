# Copy to 01-secrets.yaml and fill in real values BEFORE applying.
# Never commit the populated file — it's gitignored under k8s/01-secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: stride-secrets
  namespace: stride
type: Opaque
stringData:
  # Shared HS256 secret used by api-gateway (JWT validation) and user-service
  # (JWT issuing). Min 32 chars.
  JWT_SECRET: "REPLACE_ME_min_32_chars_for_HS256"

  # Postgres password used by every per-service database.
  POSTGRES_PASSWORD: "REPLACE_ME"

  # Groq Chat Completions API key (Phase 8 / ai-service).
  GROQ_API_KEY: ""
