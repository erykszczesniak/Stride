apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: stride
  labels: { app: user-service, role: domain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service, role: domain }
    spec:
      containers:
        - name: user-service
          image: stride/user-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
            - containerPort: 9081   # cluster-internal gRPC
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: POSTGRES_HOST
              value: postgres-user
            - name: POSTGRES_DB
              value: stride_user
            - name: POSTGRES_USER
              value: stride
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 75
            periodSeconds: 30
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits:   { memory: 768Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: stride
spec:
  selector: { app: user-service }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 9081
      targetPort: 9081
