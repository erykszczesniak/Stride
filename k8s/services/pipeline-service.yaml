apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-service
  namespace: stride
  labels: { app: pipeline-service, role: domain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pipeline-service }
  template:
    metadata:
      labels: { app: pipeline-service, role: domain }
    spec:
      containers:
        - name: pipeline-service
          image: stride/pipeline-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: POSTGRES_HOST
              value: postgres-pipeline
            - name: POSTGRES_DB
              value: stride_pipeline
            - name: POSTGRES_USER
              value: stride
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: POSTGRES_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8089 }
            initialDelaySeconds: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8089 }
            initialDelaySeconds: 60
          resources:
            requests: { memory: 384Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-service
  namespace: stride
spec:
  selector: { app: pipeline-service }
  ports:
    - port: 8089
      targetPort: 8089
