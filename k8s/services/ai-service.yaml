apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: stride
  labels: { app: ai-service, role: domain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels: { app: ai-service, role: domain }
    spec:
      containers:
        - name: ai-service
          image: stride/ai-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: GROQ_API_KEY }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            initialDelaySeconds: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            initialDelaySeconds: 60
          resources:
            requests: { memory: 384Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: stride
spec:
  selector: { app: ai-service }
  ports:
    - port: 8087
      targetPort: 8087
