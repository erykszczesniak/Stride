# Single ingress point — all external traffic enters via the gateway.
# Domain services are NOT exposed externally; the NetworkPolicy in
# network-policies.yaml enforces that the only path in is gateway → service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stride-gateway
  namespace: stride
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  rules:
    - host: stride.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
