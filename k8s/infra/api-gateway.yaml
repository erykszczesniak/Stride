apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: stride
  labels: { app: api-gateway, role: infra }
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway, role: infra }
    spec:
      containers:
        - name: api-gateway
          image: stride/api-gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_CLOUD_CONFIG_URI
              value: http://config-server:8888
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-server:8761/eureka/
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: stride-secrets, key: JWT_SECRET }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { memory: 512Mi, cpu: 100m }
            limits:   { memory: 768Mi, cpu: 500m }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: stride
spec:
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
