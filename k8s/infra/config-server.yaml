apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: stride
  labels: { app: config-server, role: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server, role: infra }
    spec:
      containers:
        - name: config-server
          image: stride/config-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8888 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8888 }
            initialDelaySeconds: 45
            periodSeconds: 30
          resources:
            requests: { memory: 384Mi, cpu: 50m }
            limits:   { memory: 512Mi, cpu: 300m }
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: stride
spec:
  selector: { app: config-server }
  ports:
    - port: 8888
      targetPort: 8888
