# Gate for everything under monitoring/: rule syntax + PromQL (promtool check),
# rule behaviour (promtool test), the alert label/annotation/test contract
# (check_alert_rules.py), Alertmanager config (amtool) and Grafana dashboards
# (grafana/dashboard-linter). Runs on every PR that touches these files.
name: Monitoring

on:
  push:
    branches: [main, microservices]
    paths: ["monitoring/**", ".github/workflows/monitoring.yml"]
  pull_request:
    branches: [main, microservices]
    paths: ["monitoring/**", ".github/workflows/monitoring.yml"]

permissions:
  contents: read

env:
  PROMETHEUS_IMAGE: prom/prometheus:v2.55.0
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.27.0
  # Same tags as docker-compose.yml, so CI validates what the stack runs.
  LOKI_IMAGE: grafana/loki:3.3.2
  OTELCOL_IMAGE: otel/opentelemetry-collector-contrib:0.115.1
  ALLOY_IMAGE: grafana/alloy:v1.5.1

jobs:
  rules:
    name: Alert rules (promtool + contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: promtool check rules
        run: |
          # the glob must expand inside the container, where /m exists
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint sh "$PROMETHEUS_IMAGE" \
            -c 'promtool check rules /m/alerts/*.rules.yml'

      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint sh "$PROMETHEUS_IMAGE" \
            -c 'promtool test rules /m/alerts/tests/*.test.yml'

      - name: promtool check config
        run: |
          docker run --rm \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/monitoring/alerts:/etc/prometheus/rules:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/monitoring:/m" --entrypoint amtool "$ALERTMANAGER_IMAGE" \
            check-config /m/alertmanager/alertmanager.yml

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Alert contract (labels, annotations, runbook, test coverage)
        run: |
          pip install --quiet pyyaml
          # Also covers monitoring/loki/rules (same contract; LogQL rules are
          # exempt from the promtool test-case rule and say so with a NOTE).
          python monitoring/scripts/check_alert_rules.py monitoring/alerts

      # LogQL has no promtool and the Loki image ships no lokitool: the script
      # starts Loki with the repo's config and rule files, then asserts every
      # alert is listed by /loki/api/v1/rules and every expr is accepted by
      # /loki/api/v1/query (a parse error is a 400).
      - name: Loki config + ruler rules (loki -verify-config, live load, LogQL parse)
        run: |
          pip install --quiet pyyaml
          LOKI_IMAGE="$LOKI_IMAGE" monitoring/scripts/check_loki_rules.sh monitoring/loki

      - name: OpenTelemetry Collector config (otelcol-contrib validate)
        run: |
          docker run --rm -v "$PWD/monitoring/otel:/c:ro" "$OTELCOL_IMAGE" validate --config=/c/otel-collector.yml

      - name: Alloy config (alloy fmt must be a no-op)
        run: |
          docker run --rm -v "$PWD/monitoring/alloy:/c:ro" "$ALLOY_IMAGE" fmt /c/config.alloy | diff - monitoring/alloy/config.alloy

  dashboards:
    name: Grafana dashboards (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable   # dashboard-linter tracks the current Go release

      # The module carries replace directives, so `go install ...@latest` is
      # refused; build from a pinned checkout instead.
      - name: Build dashboard-linter
        run: |
          git clone --quiet --depth 1 https://github.com/grafana/dashboard-linter /tmp/dashboard-linter
          (cd /tmp/dashboard-linter && go build -o "$RUNNER_TEMP/dashboard-linter" .)

      - name: Lint every provisioned dashboard
        run: |
          set -e
          for f in monitoring/grafana/dashboards/*.json; do
            echo "== $f"
            python3 -c "import json,sys; d=json.load(open('$f')); assert d.get('uid'), 'missing uid'; assert d.get('title'), 'missing title'"
            "$RUNNER_TEMP/dashboard-linter" lint --strict "$f"
          done
