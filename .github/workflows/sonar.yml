# SonarCloud: static analysis (bugs, vulnerabilities, code smells, duplication)
# plus the JaCoCo coverage from `verify`, with the quality gate blocking the PR
# (`sonar.qualitygate.wait=true`). Project settings live in pom.xml; the only
# secret is SONAR_TOKEN. Without the secret (a fork, Dependabot, a fresh
# clone of the repository) the scan is skipped instead of failing, so the
# gate never turns red for a reason unrelated to the code. See docs/sonar.md.
name: Sonar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  token:
    name: SONAR_TOKEN present?
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          PRESENT: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != "true" ]; then
            echo "::notice::SONAR_TOKEN is not available in this context; the Sonar scan is skipped (see docs/sonar.md)."
          fi

  scan:
    name: analysis and quality gate
    needs: token
    if: needs.token.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Blame data for "new code" and the PR decoration need the history.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache the Sonar scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # `verify` produces target/site/jacoco/jacoco.xml (and runs the same
      # tests, ArchUnit rules and JaCoCo gate as ci.yml); sonar:sonar uploads
      # the analysis and waits for the quality gate verdict.
      - name: Build, test and analyse
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B verify sonar:sonar -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=600
