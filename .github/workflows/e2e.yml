# Full-stack end-to-end run: boots the composed stack (backend, Postgres,
# Elasticsearch, frontend, Jaeger, Prometheus, Alertmanager, Grafana) on the
# runner, smoke-tests the API and the monitoring pipeline, then drives the
# React SPA with Playwright.
#
# Too heavy for every PR (the image build runs Maven inside Docker), so it
# runs nightly and on demand; the unit/contract gates in ci.yml stay the
# per-PR signal. Use the same script after any deploy:
# BASE_URL=https://stride.example.com scripts/smoke.sh
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"   # nightly 02:45 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # base64: the signing key is Decoders.BASE64.decode(JWT_SECRET)
      JWT_SECRET: ZTJlLXNlY3JldC1taW4tMzItY2hhcnMtdGhpcy1pcy1vbmx5LWZvci1jaS1ydW5z
      POSTGRES_PASSWORD: strava
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Boot the stack and wait for health checks
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 900
          docker compose ps

      - name: Monitoring pipeline state (targets, alertmanagers, alerts)
        run: |
          curl -s localhost:9091/api/v1/targets | head -c 1200; echo
          curl -s localhost:9093/api/v2/alerts | head -c 400; echo

      - name: Smoke test the API and the monitoring pipeline
        run: scripts/smoke.sh

      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the SPA (dev server proxies /api to the backend on :8080)
        working-directory: frontend
        run: |
          BROWSER=none CI=true nohup npm start > ../spa.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000 >/dev/null

      - name: Playwright e2e
        working-directory: frontend
        run: CI=true npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --since 30m --no-color backend | tail -400
          tail -100 spa.log || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans
