# Full-stack end-to-end run: boots the composed stack (12 services + infra +
# observability) on the runner, smoke-tests every service through the gateway
# and the monitoring pipeline, then drives the React SPA with Playwright.
#
# Too heavy for every PR (≈25 min, builds 12 images), so it runs nightly and on
# demand; the unit/contract gates in ci.yml stay the per-PR signal. Use the
# same script after a kind deploy: BASE_URL=http://stride.local scripts/smoke.sh
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"   # nightly 02:45 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JWT_SECRET: e2e-secret-min-32-chars-this-is-only-for-ci-runs-not-prod
      POSTGRES_PASSWORD: stride
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build jars (images copy the reactor; skipping tests here — ci.yml runs them)
        run: ./mvnw -B -q package -DskipTests

      - name: Boot the stack (core + observability) and wait for health checks
        run: |
          cp .env.example .env
          docker compose --profile observability up -d --build --wait --wait-timeout 600
          docker compose ps

      - name: Smoke test through the gateway and the monitoring pipeline
        run: scripts/smoke.sh

      - name: Install frontend and Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the SPA (dev server proxies /api to the gateway on :8080)
        working-directory: frontend
        run: |
          BROWSER=none CI=true nohup npm start > ../spa.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000 >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000 >/dev/null

      - name: Playwright e2e
        working-directory: frontend
        run: CI=true npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --since 30m --no-color api-gateway user-service activity-service social-service ai-service web-bff | tail -400
          tail -100 spa.log || true

      - name: Tear down
        if: always()
        run: docker compose --profile observability down -v --remove-orphans
