spring:
  application:
    name: strava-backend

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:stravadb}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  h2:
    console:
      enabled: true
      path: /h2-console

  graphql:
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800}

app:
  name: Stride
  upload:
    dir: ${UPLOAD_DIR:uploads/photos}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/v1/integrations/strava/callback}
    login-redirect-uri: ${STRAVA_LOGIN_REDIRECT_URI:http://localhost:8080/api/v1/auth/strava/callback}
    login-frontend-redirect: ${STRAVA_LOGIN_FRONTEND_REDIRECT:http://localhost:3000/auth/strava/callback}
    login-frontend-error-redirect: ${STRAVA_LOGIN_FRONTEND_ERROR_REDIRECT:http://localhost:3000/login}
    state-secret: ${STRAVA_STATE_SECRET:}
    frontend-redirect: ${STRAVA_FRONTEND_REDIRECT:http://localhost:3000/settings?section=account}
    # Pull the per-activity streams endpoint to populate GPS polyline, per-point timestamps,
    # and elevation on imported activities. Set STRAVA_IMPORT_STREAMS=false when bulk-importing
    # 1000+ activities to conserve the 100 req / 15 min rate-limit budget.
    import-streams: ${STRAVA_IMPORT_STREAMS:true}
  # Anthropic Claude — powers the conversational AI activity-analysis chat.
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-8}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

  # Guardrails for every provider-billed endpoint (see docs/ai-guardrails.md):
  # per-user rate limits (in-memory, per replica), prompt guard, PII masking,
  # and the price table AiCallRecorder uses for the ai_request_cost_usd metric.
  # Same keys as the microservices branch.
  ai:
    rate-limit:
      chat-per-minute: ${AI_CHAT_PER_MINUTE:10}
      generation-per-minute: ${AI_GENERATION_PER_MINUTE:5}
    guard:
      enabled: ${AI_GUARD_ENABLED:true}
      max-repeated-chars: 40
    pii:
      enabled: ${AI_PII_MASKING_ENABLED:true}
    # Chat failover: Anthropic first, Groq (multi-turn) when Anthropic answers
    # 502/503 or no key is configured. Degraded answers beat no answers during
    # a provider incident; every switch is counted (ai_failover_total).
    failover:
      enabled: ${AI_CHAT_FAILOVER_ENABLED:true}
    # USD per million tokens. Placeholders taken from the public price lists at
    # the time of writing — verify against the current lists before trusting
    # the cost panel; an unlisted model is recorded with priced=false.
    pricing:
      "[claude-opus-4-8]":
        input-per-mtok: 15.0
        output-per-mtok: 75.0
      "[claude-opus-5]":
        input-per-mtok: 15.0
        output-per-mtok: 75.0
      "[claude-sonnet-5]":
        input-per-mtok: 3.0
        output-per-mtok: 15.0
      "[openai/gpt-oss-120b]":
        input-per-mtok: 0.15
        output-per-mtok: 0.60

google:
  client-id: ${GOOGLE_CLIENT_ID:}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}

logging:
  level:
    com.strava: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      # Ownership tags on every meter: cost attribution (monitoring/alerts/cost.rules.yml)
      # groups infra cost by team / cost_center; one deployable, so one owner.
      team: ${STRIDE_TEAM:domain}
      cost_center: ${STRIDE_COST_CENTER:CC-STRIDE-001}
    distribution:
      # Latency histograms for http.server.requests: the SLO rules read the
      # 500 ms bucket, the p95 alerts interpolate over the rest.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2500ms
  tracing:
    enabled: true
    sampling:
      probability: 1.0   # 100% sampling in dev; lower in prod
    propagation:
      type: W3C
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
