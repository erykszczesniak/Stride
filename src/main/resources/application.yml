spring:
  application:
    name: strava-backend

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:stravadb}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  h2:
    console:
      enabled: true
      path: /h2-console

  graphql:
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800}

app:
  name: Stride
  upload:
    dir: ${UPLOAD_DIR:uploads/photos}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/v1/integrations/strava/callback}
    state-secret: ${STRAVA_STATE_SECRET:}
    frontend-redirect: ${STRAVA_FRONTEND_REDIRECT:http://localhost:3000/settings?section=account}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

logging:
  level:
    com.strava: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
