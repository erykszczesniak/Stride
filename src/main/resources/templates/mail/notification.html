<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
        .wrapper { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
        .header { background: linear-gradient(135deg, #fc4c02 0%, #ff6b35 100%); padding: 28px 32px; border-radius: 16px 16px 0 0; }
        .header span { color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .body { background: #ffffff; padding: 32px; border-radius: 0 0 16px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .icon { font-size: 36px; margin-bottom: 16px; }
        .message { color: #1a1a2e; font-size: 16px; line-height: 1.6; margin: 0 0 24px; font-weight: 500; }
        .btn { display: inline-block; background: #fc4c02; color: #ffffff !important; text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 28px; border-radius: 8px; }
        .divider { border: none; border-top: 1px solid #e2e8f0; margin: 24px 0 16px; }
        .footer { color: #94a3b8; font-size: 12px; line-height: 1.5; margin: 0; }
        .footer a { color: #fc4c02; text-decoration: none; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <span th:text="${appName}">Stride</span>
    </div>
    <div class="body">
        <div class="icon" th:utext="${icon}">&#10084;&#65039;</div>
        <p class="message" th:text="${message}">Someone liked your activity</p>
        <table cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
            <tr>
                <td>
                    <a class="btn" th:href="${actionUrl}" th:text="${actionLabel}">View Activity</a>
                </td>
            </tr>
        </table>
        <hr class="divider"/>
        <p class="footer">
            Hi <span th:text="${recipientName}">User</span>, this notification was sent from
            <span th:text="${appName}">Stride</span>. You can manage your notification preferences in
            <a th:href="${settingsUrl}">Settings</a>.
        </p>
    </div>
</div>
</body>
</html>
