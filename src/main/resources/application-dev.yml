spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:stravadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:create}
    show-sql: true
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

  h2:
    console:
      enabled: true

  graphql:
    schema:
      introspection:
        enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET:NUtsqxvqmko2PhkLf8pxHZQ4RQheHK55njws3fV7b1g=}

logging:
  level:
    com.strava: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
