spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/strava_dev}
    username: ${DATABASE_USERNAME:erykszczesniak}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}
    show-sql: true
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false
    locations: classpath:db/migration

  h2:
    console:
      enabled: false

  graphql:
    schema:
      introspection:
        enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET:NUtsqxvqmko2PhkLf8pxHZQ4RQheHK55njws3fV7b1g=}

logging:
  level:
    com.strava: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    # Silence OTel export retries when Jaeger isn't running locally.
    # Traces are still generated (sampling=1.0) — just not shipped anywhere
    # unless you also spin up `docker compose up -d jaeger`.
    io.opentelemetry.exporter.internal.http: ERROR

# Traces are generated and observable via the /actuator endpoint even
# without a Jaeger container — override OTEL_EXPORTER_OTLP_ENDPOINT to
# your own collector if you need them shipped. The OkHttp exporter will
# still attempt the default localhost:4318 call and fail quietly thanks
# to the logging override above.
management:
  tracing:
    sampling:
      probability: 1.0
