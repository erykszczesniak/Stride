spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 6
        initial-interval: 2000

# server.port, routes, redis, jwt come from Config Server (api-gateway.yml).
# Local fallback for running gateway WITHOUT config-server:
---
spring:
  config:
    activate:
      on-profile: standalone
  cloud:
    gateway:
      routes: []
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080
eureka:
  client:
    enabled: false
jwt:
  secret: dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod
  public-paths:
    - /actuator/**
