server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # `include` (not `active`) so the native backend survives environments that
    # override SPRING_PROFILES_ACTIVE (docker-compose sets it to "docker").
    include: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

logging:
  level:
    org.springframework.cloud.config: INFO
