server:
  port: 8087

groq:
  api:
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

# Prod-tighter Resilience4j overlay: shorter circuit-open window, lower
# failure threshold so we stop hammering a struggling Groq quickly.
resilience4j:
  timelimiter:
    instances:
      groq:
        timeoutDuration: 6s
  circuitbreaker:
    instances:
      groq:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
  retry:
    instances:
      groq:
        maxAttempts: 3
        waitDuration: 250ms
        exponentialBackoffMultiplier: 2
