server:
  port: 8087

# Cluster-internal gRPC client (chat activity context — ActivityInternalService
# on activity-service's grpc.server.port 9082): Eureka discovery via the
# discovery:/// scheme, plaintext inside the cluster.
grpc:
  client:
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-ai}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_ai}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common

groq:
  api:
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}

app:
  claude:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

# Prod-tighter Resilience4j overlay: shorter circuit-open window, lower failure
# threshold so we stop hammering a struggling provider quickly.
resilience4j:
  circuitbreaker:
    instances:
      groq:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
      activity-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
  retry:
    instances:
      groq:
        maxAttempts: 3
        waitDuration: 250ms
        exponentialBackoffMultiplier: 2
      activity-service:
        maxAttempts: 3
        waitDuration: 250ms

# Cost attribution (docs/cost-attribution.md): every metric this service emits
# carries team + cost_center via management.metrics.tags in the shared
# application.yml. Change ownership here, never in the dashboards.
stride:
  team: ai
  cost-center: CC-AI-003
