server:
  port: 8084

# Cluster-internal gRPC server (SocialInternalService) — separate port, never routed by the gateway.
grpc:
  server:
    port: 9084
  # Feed hydration client: activity-service's ActivityInternalService, resolved
  # from Eureka instance metadata (gRPC.port) by net.devh's discovery resolver.
  client:
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-social}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_social}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common

# Feed hydration calls activity-service's internal batch API (gRPC); when the
# circuit opens the feed degrades to the local feed_items snapshot instead of
# failing. No recordExceptions filter is set on purpose: the default records
# EVERY exception as a failure, so io.grpc.StatusRuntimeException (UNAVAILABLE,
# DEADLINE_EXCEEDED, ...) counts toward the failure rate.
resilience4j:
  circuitbreaker:
    instances:
      activity-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
  retry:
    instances:
      activity-service:
        maxAttempts: 3
        waitDuration: 250ms
        exponentialBackoffMultiplier: 2

# Cost attribution (docs/cost-attribution.md): every metric this service emits
# carries team + cost_center via management.metrics.tags in the shared
# application.yml. Change ownership here, never in the dashboards.
stride:
  team: domain
  cost-center: CC-DOMAIN-002
