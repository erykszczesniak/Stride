server:
  port: 8082

# Cluster-internal gRPC port (ActivityInternalService) — never routed by the gateway.
grpc:
  server:
    port: 9082

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-activity}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_activity}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    # db/migration/postgresql carries the PG flavor of vendor-specific
    # statements (setval after the fixed-id sample inserts).
    locations: classpath:db/migration/common,classpath:db/migration/postgresql

# Activity photo storage. Mount a volume and point UPLOAD_DIR at it in
# containers — the same value drives both the upload path and the
# /uploads/photos/** static handler.
app:
  upload:
    dir: ${UPLOAD_DIR:uploads/photos}
  # Strava OAuth2 integration (import flow only — the "Continue with Strava"
  # LOGIN variant is owned by user-service). Endpoints answer 503 until the
  # STRAVA_* env vars are provided to the container.
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    redirect-uri: ${STRAVA_REDIRECT_URI:http://localhost:8080/api/v1/integrations/strava/callback}
    state-secret: ${STRAVA_STATE_SECRET:}
    frontend-redirect: ${STRAVA_FRONTEND_REDIRECT:http://localhost:3000/settings?section=account}
    # Set STRAVA_IMPORT_STREAMS=false when bulk-importing 1000+ activities to
    # conserve the 100 req / 15 min Strava rate-limit budget.
    import-streams: ${STRAVA_IMPORT_STREAMS:true}

# Tighter Resilience4j thresholds for prod — break the circuit faster, recover faster.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      social-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 250ms
        exponentialBackoffMultiplier: 2
      social-service:
        maxAttempts: 3
        waitDuration: 250ms
        exponentialBackoffMultiplier: 2
