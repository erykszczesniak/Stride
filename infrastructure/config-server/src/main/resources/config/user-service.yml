server:
  port: 8081

# Cluster-internal gRPC endpoint (UserInternalService) — never routed by the gateway.
grpc:
  server:
    port: 9081
  # Client side of the cluster-internal ActivityInternalService (activity totals).
  # Resolved through Eureka instance metadata (gRPC.port); plaintext inside the cluster.
  client:
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-user}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_user}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/postgresql
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

jwt:
  secret: ${JWT_SECRET:dev-secret-min-32-chars-this-is-only-for-development-do-not-use-in-prod}
  access-token-ttl-seconds: 3600
  refresh-token-ttl-seconds: 604800

google:
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  strava:
    # "Continue with Strava" login flow (the import/integration flow lives in
    # activity-service). Same env vars as the monolith.
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
    login-redirect-uri: ${STRAVA_LOGIN_REDIRECT_URI:http://localhost:8080/api/v1/auth/strava/callback}
    login-frontend-redirect: ${STRAVA_LOGIN_FRONTEND_REDIRECT:http://localhost:3000/auth/strava/callback}
    login-frontend-error-redirect: ${STRAVA_LOGIN_FRONTEND_ERROR_REDIRECT:http://localhost:3000/login}
    state-secret: ${STRAVA_STATE_SECRET:}
