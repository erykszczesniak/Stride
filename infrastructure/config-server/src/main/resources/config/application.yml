# Shared config — applied to ALL services that fetch from this Config Server.
# Per-service overrides live in <service-name>.yml in this same directory.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-server:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    # Latency histograms for every HTTP server timer. Without this only
    # count/sum are exported and histogram_quantile() in the SLO/latency
    # alerts and dashboards returns nothing. The extra SLO boundaries make the
    # "requests faster than 500 ms" ratio in monitoring/alerts/slo.rules.yml
    # exact instead of interpolated.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2500ms
    tags:
      # Stable identity for every metric regardless of how it was scraped
      # (Eureka SD adds `app`; this survives a static scrape too).
      application: ${spring.application.name}
      # Cost attribution labels (docs/cost-attribution.md). Each service sets
      # stride.team / stride.cost-center in its own <service>.yml; a service
      # that forgets shows up as `unassigned` on the cost dashboard instead
      # of silently disappearing from it.
      team: ${stride.team:unassigned}
      cost_center: ${stride.cost-center:unassigned}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4318}/v1/traces

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.strava.shared.events,*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
