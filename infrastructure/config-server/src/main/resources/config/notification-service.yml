server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-notification}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_notification}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
