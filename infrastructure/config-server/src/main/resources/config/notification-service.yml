server:
  port: 8083

# Client side of the cluster-internal gRPC surfaces (UserInternalService,
# ActivityInternalService). Resolved through Eureka instance metadata
# (gRPC.port); plaintext inside the cluster.
grpc:
  client:
    user-service:
      address: discovery:///user-service
      negotiationType: plaintext
    activity-service:
      address: discovery:///activity-service
      negotiationType: plaintext

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres-notification}:${POSTGRES_PORT:5432}/${POSTGRES_DB:stride_notification}
    username: ${POSTGRES_USER:stride}
    password: ${POSTGRES_PASSWORD:stride}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  name: Stride
  cors:
    # First entry doubles as the frontend base URL for email action links
    # (mirrors the monolith's app.cors.allowed-origins derivation).
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  weekly-summary:
    page-size: ${WEEKLY_SUMMARY_PAGE_SIZE:200}

management:
  health:
    mail:
      enabled: false  # blank creds must not fail the readiness probe

# Tighter Resilience4j thresholds for prod — break the circuit faster, recover faster.
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
      activity-service:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 30s
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 250ms
      activity-service:
        maxAttempts: 3
        waitDuration: 250ms

# Cost attribution (docs/cost-attribution.md): every metric this service emits
# carries team + cost_center via management.metrics.tags in the shared
# application.yml. Change ownership here, never in the dashboards.
stride:
  team: domain
  cost-center: CC-DOMAIN-002
