# Gateway routing + JWT config.
#
# The public contract is identical to the monolith on `main` (/api/v1/**, /graphql,
# /pipeline/v1/**, /uploads/**). The gateway does NO path rewriting — services mount
# the public paths directly, so traces and logs show the same URL end to end.
#
# Route matching notes:
#  - Fine-grained social routes (comments/likes/feed/public under /api/v1/activities)
#    carry order -1 so they win over the activity-service catch-all (order 0).

server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 100
            redis-rate-limiter.burstCapacity: 200
            key-resolver: "#{@principalKeyResolver}"
      routes:
        # === user-service: auth, users, follow graph, search, admin (users) ===
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/search/**,/api/v1/admin/users/**

        # === social-service: comments, reactions, likes, feed read model ===
        # More specific than the activity-service catch-all → explicit order -1.
        - id: social-service-activity-subresources
          uri: lb://social-service
          order: -1
          predicates:
            - Path=/api/v1/activities/feed,/api/v1/activities/public,/api/v1/activities/*/comments/**,/api/v1/activities/*/like

        # === activity-service: activities, PRs, gear, import, Strava integration, photos ===
        - id: activity-service
          uri: lb://activity-service
          predicates:
            - Path=/api/v1/activities/**,/api/v1/personal-records/**,/api/v1/gear/**,/api/v1/import/**,/api/v1/integrations/strava/**,/api/v1/admin/activities/**,/uploads/**

        # === notification-service: notifications + SSE stream ===
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # === club-event-service ===
        - id: club-event-service
          uri: lb://club-event-service
          predicates:
            - Path=/api/v1/clubs/**,/api/v1/events/**

        # === challenge-goal-service: challenges, goals, training plan templates ===
        - id: challenge-goal-service
          uri: lb://challenge-goal-service
          predicates:
            - Path=/api/v1/challenges/**,/api/v1/goals/**,/api/v1/training-plans/**

        # === ai-service ===
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/v1/ai/**

        # === web-bff: dashboard composition, report GraphQL, CSV export, admin stats ===
        - id: web-bff
          uri: lb://web-bff
          predicates:
            - Path=/api/v1/dashboard/**,/graphql,/api/v1/export/**,/api/v1/admin/stats

        # === pipeline-service: iOS facade + personal token management ===
        - id: pipeline-service
          uri: lb://pipeline-service
          predicates:
            - Path=/pipeline/v1/**,/api/v1/pipeline/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

cors:
  origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  secret: ${JWT_SECRET}
  public-paths:
    - /api/v1/auth/**
    - /api/v1/integrations/strava/callback
    - /uploads/**
    - /actuator/**
    # tri_ personal tokens are not JWTs — pipeline-service authenticates them itself.
    - /pipeline/v1/**
  # EventSource cannot send an Authorization header — these paths may pass ?token=.
  query-token-paths:
    - /api/v1/notifications/stream

# Cost attribution (docs/cost-attribution.md): every metric this service emits
# carries team + cost_center via management.metrics.tags in the shared
# application.yml. Change ownership here, never in the dashboards.
stride:
  team: platform
  cost-center: CC-PLATFORM-001
